name: microserv

services:
  appmain:
    build:
      context: ./backend/appmain
    container_name: microserv-appmain
    working_dir: /var/www/html
    volumes:
      - ./backend/appmain:/var/www/html
    environment:
      APP_NAME: AppMain
      APP_ENV: local
      APP_DEBUG: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  appmain-nginx:
    image: nginx:1.27-alpine
    container_name: microserv-appmain-nginx
    volumes:
      - ./backend/appmain:/var/www/html:ro
      - ./backend/appmain/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8001:80"
    depends_on:
      - appmain

  appslave:
    build:
      context: ./backend/appslave
    container_name: microserv-appslave
    working_dir: /var/www/html
    volumes:
      - ./backend/appslave:/var/www/html
    environment:
      APP_NAME: AppSlave
      APP_ENV: local
      APP_DEBUG: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  appslave-nginx:
    image: nginx:1.27-alpine
    container_name: microserv-appslave-nginx
    volumes:
      - ./backend/appslave:/var/www/html:ro
      - ./backend/appslave/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8002:80"
    depends_on:
      - appslave

  redis:
    image: redis:7.4-alpine
    container_name: microserv-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: microserv-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  redis-data:
  kafka-data:
